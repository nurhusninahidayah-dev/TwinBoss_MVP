openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TwinBoss SME delegation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: twinboss
    description: SME requests, recommendations, decisions, and activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [twinboss]
      summary: Get boss dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /requests:
    get:
      operationId: getRequests
      tags: [twinboss]
      summary: List requests for the approval queue
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestListItem"
    post:
      operationId: createRequest
      tags: [twinboss]
      summary: Submit a staff request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
  /requests/{id}:
    get:
      operationId: getRequest
      tags: [twinboss]
      summary: Get request details and customer context
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "404":
          description: Request not found
  /requests/{id}/recommendation:
    post:
      operationId: analyzeRequest
      tags: [twinboss]
      summary: Generate a Groq recommendation for a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated request with AI recommendation and alternatives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
  /requests/{id}/decision:
    post:
      operationId: decideRequest
      tags: [twinboss]
      summary: Record the boss's decision and create a decision receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Decision receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionReceipt"
        "400":
          description: Invalid decision or missing override reason
  /requests/{id}/message-draft:
    post:
      operationId: generateCustomerMessage
      tags: [twinboss]
      summary: Draft a WhatsApp customer update after an owner decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer message draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMessageDraft"
        "409":
          description: Owner decision has not been recorded
  /customers:
    get:
      operationId: getCustomers
      tags: [twinboss]
      summary: List mock Orbyte customer records
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /rules:
    get:
      operationId: getRules
      tags: [twinboss]
      summary: List owner and learned business rules
      responses:
        "200":
          description: Business rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessRule"
  /activity:
    get:
      operationId: getActivity
      tags: [twinboss]
      summary: List decision receipts and recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RequestStatus:
      type: string
      enum: [pending, approved, rejected]
    DecisionAction:
      type: string
      enum: [approve, store_credit, reject]
    RequestType:
      type: string
      enum: [refund, discount, purchase]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    Alternative:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/DecisionAction"
        label:
          type: string
        explanation:
          type: string
      required: [action, label, explanation]
    RequestListItem:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: "#/components/schemas/RequestType"
        title:
          type: string
        amount:
          type: number
        staffName:
          type: string
        customerName:
          type: string
        customerTier:
          type: string
        submittedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/RequestStatus"
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        recommendation:
          anyOf:
            - $ref: "#/components/schemas/DecisionAction"
            - type: "null"
        confidence:
          type: ["integer", "null"]
      required: [id, type, title, amount, staffName, customerName, customerTier, submittedAt, status, riskLevel, recommendation, confidence]
    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestListItem"
        - type: object
          properties:
            description:
              type: string
            customerLifetimeValue:
              type: number
            staffRole:
              type: string
            matchedRule:
              type: ["string", "null"]
            recommendationExplanation:
              type: ["string", "null"]
            alternatives:
              type: array
              items:
                $ref: "#/components/schemas/Alternative"
            recommendationSource:
              type: ["string", "null"]
            decidedAction:
              anyOf:
                - $ref: "#/components/schemas/DecisionAction"
                - type: "null"
            decisionReason:
              type: ["string", "null"]
          required: [description, customerLifetimeValue, staffRole, matchedRule, recommendationExplanation, alternatives, recommendationSource, decidedAction, decisionReason]
    RequestInput:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/RequestType"
        customerName:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0
        description:
          type: string
          minLength: 1
        staffName:
          type: string
          minLength: 1
      required: [type, customerName, title, amount, description, staffName]
    DecisionInput:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/DecisionAction"
        reason:
          type: string
      required: [action]
    DecisionReceipt:
      type: object
      properties:
        id:
          type: integer
        requestId:
          type: integer
        receiptNumber:
          type: string
        requestTitle:
          type: string
        customerName:
          type: string
        staffName:
          type: string
        requestedAmount:
          type: number
        requestedAction:
          anyOf:
            - $ref: "#/components/schemas/DecisionAction"
            - type: "null"
        chosenAction:
          $ref: "#/components/schemas/DecisionAction"
        reason:
          type: ["string", "null"]
        ruleApplied:
          type: ["string", "null"]
        decisionBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        syncStatus:
          type: string
        learningNote:
          type: ["string", "null"]
      required: [id, requestId, receiptNumber, requestTitle, customerName, staffName, requestedAmount, requestedAction, chosenAction, reason, ruleApplied, decisionBy, decidedAt, syncStatus, learningNote]
    CustomerMessageDraft:
      type: object
      properties:
        draft:
          type: string
          minLength: 1
          maxLength: 1200
      required: [draft]
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tier:
          type: string
        lifetimeValue:
          type: number
        orders:
          type: integer
        notes:
          type: string
      required: [id, name, tier, lifetimeValue, orders, notes]
    BusinessRule:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        source:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, description, enabled, source, createdAt]
    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        title:
          type: string
        description:
          type: string
        actor:
          type: string
        createdAt:
          type: string
          format: date-time
        requestId:
          type: ["integer", "null"]
        amount:
          type: ["number", "null"]
        action:
          anyOf:
            - $ref: "#/components/schemas/DecisionAction"
            - type: "null"
        receiptNumber:
          type: ["string", "null"]
        requestTitle:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        staffName:
          type: ["string", "null"]
        requestedAction:
          anyOf:
            - $ref: "#/components/schemas/DecisionAction"
            - type: "null"
        reason:
          type: ["string", "null"]
        ruleApplied:
          type: ["string", "null"]
        decisionBy:
          type: ["string", "null"]
        syncStatus:
          type: ["string", "null"]
        learningNote:
          type: ["string", "null"]
      required: [id, kind, title, description, actor, createdAt, requestId, amount, action, receiptNumber, requestTitle, customerName, staffName, requestedAction, reason, ruleApplied, decisionBy, syncStatus, learningNote]
    DashboardSummary:
      type: object
      properties:
        waitingForDecision:
          type: integer
        handledToday:
          type: integer
        averageResponseMinutes:
          type: integer
        timeSavedMinutes:
          type: integer
      required: [waitingForDecision, handledToday, averageResponseMinutes, timeSavedMinutes]

